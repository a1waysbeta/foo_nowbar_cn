name: Build Component (x86 & x64)

on:
  workflow_dispatch:

jobs:
# =============================================================================
# 1. Build x86 + x64 (matrix)
# =============================================================================
  build-multi-platform:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x86, x64]
        include:
          - platform: x86
            msbuild_platform: Win32
            outdir_platform: x86
          - platform: x64
            msbuild_platform: x64
            outdir_platform: x64

    steps:
    # -------------------------------------------------------------------------
    # 1. Checkout Repositories
    # 所有 checkout 均显式 fetch-depth: 1 浅拉取（GitHub 支持直接按 SHA 浅拉取，
    # 即 git fetch --depth=1 origin <sha>，不会下载仓库完整历史）
    # -------------------------------------------------------------------------
    - name: Checkout foo_nowbar
      uses: actions/checkout@v6
      with:
        path: foo_nowbar
        fetch-depth: 1

    - name: Checkout Columns UI Source
      uses: actions/checkout@v6
      with:
        repository: reupen/columns_ui
        path: foo_nowbar/lib/columns_ui
        fetch-depth: 1

    # foobar2000-sdk-modified 使用 Commits169-SDK-2026-10-01 版本
    # PFC 使用 Commits120-SDK-2026-10-01 版本
    # columns_ui-sdk 使用与 Columns UI v3.7.0 使用的子模块提交一致
    - name: Checkout Columns UI SDK
      uses: actions/checkout@v6
      with:
        repository: reupen/columns_ui-sdk
        ref: 69972e36febc4bfc2685fa1a7620d0ee8789e10f
        path: foo_nowbar/lib/columns_ui/columns_ui-sdk
        fetch-depth: 1

    - name: Checkout Foobar2000 SDK
      uses: actions/checkout@v6
      with:
        repository: reupen/foobar2000-sdk-modified
        ref: f56be547d34468da2ff47fcf49eacee41b6f42b1
        path: foo_nowbar/lib/columns_ui/foobar2000
        fetch-depth: 1

    - name: Checkout PFC
      uses: actions/checkout@v6
      with:
        repository: reupen/pfc-modified
        ref: 75053edf649b41b2202fcc7b9c5c3848a0e9a8cb
        path: foo_nowbar/lib/columns_ui/pfc
        fetch-depth: 1

    # libPPUI（头文件必需）：nowbar 的 pch.h include 了 helpers/helpers.h，
    # 而 SDK helpers（win32_misc.h、file_win32_wrapper.h、atl-misc.h 等）依赖
    # 官方 foobar2000 SDK 的 libPPUI 目录（reupen 的 foobar2000-sdk-modified 不包含它）。
    # 直接从官方 SDK 压缩包提取（锁定 2026-10-01，与上方 reupen fork 基于的
    # SDK 版本一致）。7z 命令为 windows-2022 runner 预装的 7-Zip。
    - name: Download official SDK and extract libPPUI
      shell: pwsh
      run: |
        $sdkUrl = "https://www.foobar2000.org/downloads/SDK-2026-10-01.7z"
        $zip = "$env:TEMP\fb2k_sdk.7z"
        Invoke-WebRequest -Uri $sdkUrl -OutFile $zip
        7z x $zip -o"$env:TEMP\fb2k_sdk" | Out-Null
        if (-not (Test-Path "$env:TEMP\fb2k_sdk\libPPUI\libPPUI.vcxproj")) {
          Write-Host "::error::libPPUI not found in official SDK archive"
          exit 1
        }
        Move-Item "$env:TEMP\fb2k_sdk\libPPUI" "foo_nowbar\lib\columns_ui\libPPUI"

    # -------------------------------------------------------------------------
    # 2. Build Environment Setup
    # -------------------------------------------------------------------------
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Debug Directory Structure
      run: |
        echo "Listing columns_ui structure..."
        dir foo_nowbar\lib\columns_ui
        echo ""
        echo "Checking pfc..."
        dir foo_nowbar\lib\columns_ui\pfc
        echo ""
        echo "Checking foobar2000 SDK..."
        dir foo_nowbar\lib\columns_ui\foobar2000\SDK
        echo ""
        echo "Checking libPPUI..."
        dir foo_nowbar\lib\columns_ui\libPPUI
      shell: cmd

    - name: Fix Platform Toolset for GitHub Actions
      shell: pwsh
      run: |
        Get-ChildItem -Path foo_nowbar -Recurse -Filter *.vcxproj | ForEach-Object {
          $content = Get-Content $_.FullName -Raw
          if ($content -match 'v14[05]') {
            Write-Host "Fixing: $($_.Name)"
            $content -replace 'v14[05]', 'v143' | Set-Content $_.FullName -NoNewline
          }
        }

    # -------------------------------------------------------------------------
    # 3. Build Dependencies
    # -------------------------------------------------------------------------
    - name: Build PFC (${{ matrix.platform }})
      shell: cmd
      run: |
        msbuild foo_nowbar\lib\columns_ui\pfc\pfc.vcxproj ^
          /p:Configuration=Release ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=${{ matrix.outdir_platform }}\pfc\

    - name: Build Foobar2000 SDK (${{ matrix.platform }})
      shell: cmd
      run: |
        msbuild foo_nowbar\lib\columns_ui\foobar2000\SDK\foobar2000_SDK.vcxproj ^
          /p:Configuration=Release ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=${{ matrix.outdir_platform }}\foobar2000_SDK\

    - name: Build Columns UI SDK (${{ matrix.platform }})
      shell: cmd
      run: |
        msbuild foo_nowbar\lib\columns_ui\columns_ui-sdk\columns_ui-sdk.vcxproj ^
          /p:Configuration=Release ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=${{ matrix.outdir_platform }}\columns_ui_sdk\

    - name: Build Shared (${{ matrix.platform }})
      shell: cmd
      run: |
        if exist foo_nowbar\lib\columns_ui\foobar2000\shared\shared.vcxproj (
          msbuild foo_nowbar\lib\columns_ui\foobar2000\shared\shared.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=${{ matrix.msbuild_platform }}
        ) else (
           echo "shared.vcxproj not found, assuming shared.lib is built manually."
        )

    # -------------------------------------------------------------------------
    # 4. Build Your Component
    # -------------------------------------------------------------------------
    - name: Build foo_nowbar (${{ matrix.platform }})
      shell: cmd
      run: |
        msbuild foo_nowbar\foo_nowbar.vcxproj ^
          /p:Configuration=Release ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=..\bin\${{ matrix.outdir_platform }}\

    - name: Upload DLL (${{ matrix.platform }})
      uses: actions/upload-artifact@v7
      with:
        name: foo_nowbar_${{ matrix.platform }}
        path: bin/${{ matrix.outdir_platform }}/foo_nowbar.dll
        if-no-files-found: error

# =============================================================================
# 2. Package → ONE fb2k-component
# =============================================================================
  package:
    runs-on: windows-2022
    needs: build-multi-platform
    name: Package fb2k-component

    steps:
    - name: Download x86 DLL
      uses: actions/download-artifact@v8
      with:
        name: foo_nowbar_x86
        path: component_temp

    - name: Download x64 DLL
      uses: actions/download-artifact@v8
      with:
        name: foo_nowbar_x64
        path: component_temp\x64

    - name: Verify structure
      shell: cmd
      run: |
        echo ===== component structure =====
        dir component_temp /s

    - name: Create fb2k-component
      shell: powershell
      run: |
        Compress-Archive `
          -Path "component_temp\*" `
          -DestinationPath "foo_nowbar.zip" `
          -CompressionLevel Optimal

        Rename-Item `
          -Path "foo_nowbar.zip" `
          -NewName "foo_nowbar.fb2k-component"

    - name: Upload final component
      uses: actions/upload-artifact@v7
      with:
        name: foo_nowbar_component
        path: foo_nowbar.fb2k-component
        if-no-files-found: error